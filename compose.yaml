volumes:
  mysql_data:

services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=example
      - MYSQL_USER=app
      - MYSQL_PASSWORD=very_strong
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password" ]
      timeout: 20s
      retries: 10
      start_period: 30s
      interval: 10s
    networks:
      - app-network

  app:
    build: .
    environment:
      - DB_HOST=mysql
      - DB_USER=app
      - DB_PASSWORD=very_strong
      - DB_NAME=example
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      app-network:
        ipv4_address: 172.20.0.5  # ← фиксированный IP

  haproxy:
    image: haproxy:2.8
    ports:
      - "8080:8080"
      - '8090:8090'
    volumes:
       - ./haproxy/reverse/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - app
    networks:
      - app-network

  nginx:
    image: nginx:stable
    network_mode: service:haproxy
    volumes:
      - ./nginx/ingress/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ingress/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - haproxy
#    networks:
#      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16